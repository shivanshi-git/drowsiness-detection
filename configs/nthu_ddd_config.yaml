  min_lr: 1.0e-6
  weight_decay: 5.0e-5      # Reduced weight decay for Transformers
  warmup_epochs: 6          # Linear LR warmup to avoid early instability
  gradient_clip_norm: 1.0   # Essential for Transformer stability
  mixed_precision: true     # AMP for speed (GPU only)
  num_workers: 4            # Set to 0 on Windows if dataloader errors
  checkpoint_dir: "saved_models/nthu_sota_90"
  save_best_only: true
  num_classes: 5

  # MixUp augmentation (clip-level blending)
  use_mixup: true
  mixup_alpha: 0.4          # Beta distribution alpha for MixUp blending ratio

  # EMA (Exponential Moving Average) for stable val
  ema_decay: 0.9995

  # Early stopping
  early_stop_patience: 12   # Stop if no improvement for 12 epochs

adaptive_alarm:
  smoothing_window: 10
  alert_level_1_thresh: 0.45
  alert_level_2_thresh: 0.65
  alert_level_3_thresh: 0.85
  perclos_window_sec: 60
  perclos_drowsy_thresh: 0.15
  consecutive_closure_sec: 1.5
