# ==============================================================================
# SOTA Low-Light Driver Drowsiness Detection Pipeline Configuration (NTHU-DDD)
# Target: 90%+ Validation Accuracy
# ==============================================================================

dataset:
  name: "NTHU-DDD"
  raw_dir: "archive(2)/NTHU DDD"
  processed_dir: "data/nthu_ddd_processed"
  sequence_length: 16       # Number of consecutive temporal frames per sample
  frame_step: 2             # Frame sub-sampling step (stride between selected frames)
  image_size: [224, 224]    # [H, W] for LLFormer & Face RoI
  eye_crop_size: [64, 64]   # [H, W] for Eye RoIs
  mouth_crop_size: [64, 64] # [H, W] for Mouth RoI
  optical_flow_size: [112, 112] # [H, W] for Optical Flow ViT
  num_classes: 5            # 0: Normal, 1: Slow Blinking, 2: Yawning, 3: Nodding, 4: Eye Closure
  class_names:
    - "Normal"
    - "Slow Blinking"
    - "Yawning"
    - "Nodding"
    - "Eye Closure"
  subject_splits:
    train_subjects: ["001", "002", "005"]
    val_subjects: ["006"]
    test_subjects: ["006"]

pipeline:
  retinaface:
    confidence_threshold: 0.80
    nms_threshold: 0.40
    input_size: [320, 320]

  llformer:
    dim: 48
    num_blocks: [2, 2, 4, 4]
    heads: [1, 2, 4, 8]
    ffn_expansion_factor: 2.66
    bias: false
    pretrained_weights: null

  region_vit:
    patch_size: 16
    embed_dim: 256
    depth: 4
    num_heads: 8
    mlp_ratio: 4.0
    dropout: 0.1

  flow_vit:
    patch_size: 16
    embed_dim: 256
    depth: 4
    num_heads: 8
    mlp_ratio: 4.0
    dropout: 0.1

  cross_attention:
    dim: 256
    num_heads: 8
    dropout: 0.1

  spatial_channel_attention:
    reduction_ratio: 16
    kernel_size: 7

  temporal_transformer:
    embed_dim: 256
    depth: 4
    num_heads: 8
    mlp_ratio: 4.0
    dropout: 0.1

# ------------------------------------------------------------------------------
# Training Hyperparameters — tuned for 90%+ accuracy
# ------------------------------------------------------------------------------
training:
  batch_size: 16
  epochs: 30
  learning_rate: 3.0e-4
  min_lr: 1.0e-6
  weight_decay: 1.0e-4
  warmup_epochs: 5
  optimizer: "AdamW"
  scheduler: "CosineAnnealingLR"
  gradient_clip_norm: 1.0
  mixed_precision: true
  num_workers: 4
  checkpoint_dir: "saved_models"
  save_best_only: true
  num_classes: 5

  # MixUp augmentation (clip-level blending)
  use_mixup: true
  mixup_alpha: 0.4          # Beta distribution alpha for MixUp blending ratio

  # EMA (Exponential Moving Average) for stable val
  ema_decay: 0.9995

  # Early stopping
  early_stop_patience: 12   # Stop if no improvement for 12 epochs

adaptive_alarm:
  smoothing_window: 10
  alert_level_1_thresh: 0.45
  alert_level_2_thresh: 0.65
  alert_level_3_thresh: 0.85
  perclos_window_sec: 60
  perclos_drowsy_thresh: 0.15
  consecutive_closure_sec: 1.5
